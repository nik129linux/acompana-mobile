<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf9">
  <title>Acompaña · turno de enfermería</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/ai.css">
  <link rel="stylesheet" href="css/events.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/detail.css">
  <link rel="stylesheet" href="css/android.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/screens/sheets.css">
  <link rel="stylesheet" href="css/screens/nurse.css">
  <link rel="stylesheet" href="css/screens/readers.css">
  <link rel="stylesheet" href="css/shell.css">
</head>
<body>
  <main class="stage" aria-label="Prototipo de app de enfermería">
    <section class="phone" data-role="enfermero" style="--role-index: 0" aria-label="Vista de la aplicación Acompaña" data-i18n-label="Vista de la aplicación Acompaña">
      <div class="phone-notch" aria-hidden="true"></div>
      <div class="status-bar" aria-hidden="true">
        <span class="status-time">09:41</span>
        <span class="status-icons">••• 5G 100%</span>
      </div>

      <div class="role-row">
      <div class="role-switch" role="tablist" aria-label="Cambiar de lector">
        <div class="role-switch-indicator" aria-hidden="true"></div>
        <button type="button" class="role-tab is-active" data-role="enfermero" role="tab" aria-selected="true">Enfermero</button>
        <button type="button" class="role-tab" data-role="paciente" role="tab" aria-selected="false">Paciente</button>
        <button type="button" class="role-tab" data-role="familia" role="tab" aria-selected="false">Familia</button>
      </div>
      </div>

      <main id="screen" class="screen" aria-live="polite"></main>

      <nav id="bottomNav" class="bottom-nav" aria-label="Navegación principal" data-i18n-label="Navegación principal"></nav>

      <button type="button" class="fab-register" data-fab-register aria-label="Registrar" data-i18n-label="Registrar">
        <span class="fab-register-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></span>
        <span class="fab-register-label" data-i18n="Registrar">Registrar</span>
      </button>

      <div id="snackbar" class="snackbar" data-tray-feedback role="status" aria-live="polite"></div>

      <div id="registrationLayer" class="registration-layer" aria-hidden="true"></div>
      <div id="aiLayer" class="ai-layer" aria-hidden="true"></div>
      <div id="celebrationLayer" class="celebration-layer" aria-hidden="true"></div>
      <div id="errorLayer" class="error-layer" aria-hidden="true"></div>
      <div id="splashLayer" class="splash-layer" aria-label="Bienvenida a Acompaña" data-i18n-label="Bienvenida a Acompaña">
        <div class="splash-content">
          <div class="splash-mascot" aria-hidden="true"></div>
          <h1 class="splash-wordmark">Acompaña</h1>
          <p class="splash-tagline" data-i18n="El turno, a la vista. Sin perder lo importante.">El turno, a la vista. Sin perder lo importante.</p>
          <button type="button" class="splash-skip" data-splash-skip data-i18n="Entrar ahora">Entrar ahora</button>
        </div>
      </div>
    </section>
    <p class="stage-hint" data-i18n="Cambia de rol y toca las tarjetas para explorar el turno.">Cambia de rol y toca las tarjetas para explorar el turno.</p>
  </main>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/icons.js" defer></script>
  <script src="js/motion.js" defer></script>
  <script src="js/views/nurse.js" defer></script>
  <script src="js/views/patient.js" defer></script>
  <script src="js/views/family.js" defer></script>
  <script src="js/views/sheets.js" defer></script>
  <script src="js/views/chat.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
